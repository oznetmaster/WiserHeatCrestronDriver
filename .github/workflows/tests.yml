name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: ad67729080f9d753c16b9f0d4acdd13c52bab5e3
          path: CrestronHomeNUnit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install processor packaging tools
        run: ../CrestronHomeNUnit/tools/InstallCiTools.ps1
      - name: Verify discovery coverage guards
        run: ./tools/Test-DiscoveredCoverageGuards.ps1
      - name: Run NUnit driver tests
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WiserHeatCrestronDriver.Tests/WiserHeatCrestronDriver.Tests.csproj -Framework net472 -AllowProcessorSkips -ResultsDirectory TestResults
      - name: Validate independent room observation
        run: |
          dotnet test WiserHeatCrestronDriver.ControlProbe.Tests/WiserHeatCrestronDriver.ControlProbe.Tests.csproj -c Release --logger "trx;LogFileName=control-probe.trx" --results-directory TestResults/ControlProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate read-only endurance producer
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WiserHeatCrestronDriver.EnduranceProbe.Tests/WiserHeatCrestronDriver.EnduranceProbe.Tests.csproj -Framework net10.0 -OfflineOnly -ResultsDirectory TestResults
      - name: Verify Android tests remain offline without a workflow
        env:
          CRESTRON_HOME_ANDROID_CONTEXT: ''
          CRESTRON_HOME_WISER_UI_SETTINGS: ''
        run: |
          foreach ($project in @('WiserHeatCrestronDriver.AndroidTests', 'WiserHeatCrestronDriver.AndroidControlTests')) {
            dotnet test "$project/$project.csproj" -c Release --logger "trx;LogFileName=offline.trx" --results-directory "TestResults/$project"
            if ($LASTEXITCODE -ne 0) { throw 'Offline Android test validation failed.' }
            [xml]$result = Get-Content "TestResults/$project/offline.trx" -Raw
            $counts = $result.TestRun.ResultSummary.Counters
            $cases = @($result.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult']"))
            # NUnit's TRX writer can leave notExecuted at zero for skipped cases;
            # use each recorded outcome and require that none actually executed.
            if ($cases.Count -le 0 -or [int]$counts.total -ne $cases.Count -or [int]$counts.executed -ne 0 -or
                @($cases | Where-Object { $_.outcome -ne 'NotExecuted' }).Count -ne 0 -or [int]$counts.failed -ne 0 -or [int]$counts.passed -ne 0) {
              throw 'Every Android fixture must remain skipped when no processor workflow is active.'
            }
          }
      - name: Restore private desktop SDK dependency
        env:
          COMPACT_1: ${{ secrets.CI_COMPACT_JSON_1 }}
          COMPACT_2: ${{ secrets.CI_COMPACT_JSON_2 }}
          COMPACT_3: ${{ secrets.CI_COMPACT_JSON_3 }}
          COMPACT_4: ${{ secrets.CI_COMPACT_JSON_4 }}
          COMPACT_5: ${{ secrets.CI_COMPACT_JSON_5 }}
        run: |
          $encoded = $env:COMPACT_1 + $env:COMPACT_2 + $env:COMPACT_3 + $env:COMPACT_4 + $env:COMPACT_5
          if ([string]::IsNullOrEmpty($encoded)) { throw 'Desktop SDK dependency unavailable. Fork PRs require a trusted maintainer CI run.' }
          $inputStream = [IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
          $gzip = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $path = Join-Path $env:RUNNER_TEMP 'Newtonsoft.Json.Compact.dll'
          $output = [IO.File]::Create($path)
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $inputStream.Dispose() }
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$path" >> $env:GITHUB_ENV
      - name: Run desktop SDK lifecycle harness
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WiserHeatCrestronDriver.Lifecycle.Tests/WiserHeatCrestronDriver.Lifecycle.Tests.csproj -Framework net10.0 -ResultsDirectory TestResults
      - name: Build processor package
        run: |
          dotnet build WiserHeatCrestronDriver.ProcessorTests/WiserHeatCrestronDriver.ProcessorTests.csproj -c Release -p:BuildProcessorTestPackages=true -p:ReleaseVersion=1.0.0 -p:DeployAfterBuild=false "-p:ManifestUtilExe=$env:MANIFEST_UTIL_EXE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate renamed driver package startup
        run: |
          $frameworkReferences = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.7.2'
          $frameworkRuntime = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319'
          dotnet build WiserHeatCrestronDriver/WiserHeatCrestronDriver.csproj -c Release -p:DeployAfterBuild=false -p:AssemblyName=NeilColvin_Thermostat_WiserHeat_IP_V2 "-p:ManifestUtilExe=$env:MANIFEST_UTIL_EXE" "-p:LocalNet472ReferenceAssemblies=$frameworkReferences" "-p:LocalNetFxRuntimeDir=$frameworkRuntime" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false
          if ($LASTEXITCODE -ne 0) { throw 'Renamed driver package build failed.' }
          dotnet run --project tools/PackageSmokeTest/PackageSmokeTest.csproj -c Release -- WiserHeatCrestronDriver/bin/Release/net472/NeilColvin_Thermostat_WiserHeat_IP_V2.pkg
          if ($LASTEXITCODE -ne 0) { throw 'Packaged entry point could not initialize.' }
      - name: Run the packaged unit suite twice
        run: |
          $output = Join-Path $PWD 'WiserHeatCrestronDriver.ProcessorTests/bin/Release/net472'
          $extracted = Join-Path $env:RUNNER_TEMP 'driver-package-tests'
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $output 'WiserHeatCrestronDriver.ProcessorTests.pkg'), $extracted)
          # Compare against the project actually embedded in the package. The desktop
          # harness also includes a manifest-resource test which cannot run in the host.
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Package -SdkRoot ../CrestronHomeNUnit -PackageAssembly (Join-Path $extracted 'WiserHeatCrestronDriver.ProcessorTests.dll') -SourceInventory TestResults/WiserHeatCrestronDriver.Tests/inventory.json -ResultsDirectory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: driver/TestResults
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WiserHeatCrestronDriver-processor-tests
          path: driver/WiserHeatCrestronDriver.ProcessorTests/bin/Release/net472/WiserHeatCrestronDriver.ProcessorTests.pkg
          if-no-files-found: error
